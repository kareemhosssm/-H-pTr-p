<section class="relative bg-gradient-to-b from-[#def8ff] via-[#def8ff] to-[#2c6c8b] pt-4 pb-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <!-- Section Header -->
    <div class="mx-auto max-w-2xl text-center mb-16">
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-[#19B8D1]">
            {{ 'TESTIMONIALS.SUBTITLE' | translate }}
        </p>
    
        <h2 class="mt-2 text-3xl font-extrabold text-[#071D2B] sm:text-4xl">
            {{ 'TESTIMONIALS.TITLE' | translate }}
        </h2>
    </div>

        <!-- Testimonials Grid (Dynamic Columns) -->
        <div class="grid gap-6 sm:grid-cols-2" [ngClass]="columns === 3 ? 'lg:grid-cols-3' : 'lg:grid-cols-4'">

            @for (item of displayedTestimonials; track item.name) {
            <div class="rounded-3xl border border-slate-200/80 bg-white p-6 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <div class="h-12 w-12 rounded-full overflow-hidden flex-shrink-0 border border-slate-200">
                            <img [src]="item.image" [alt]="item.name" [ngClass]="item.scaleClass"
                                class="h-full w-full object-cover object-top" />
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-[#071D2B]">{{ item.name }}</h4>
                            <p class="text-xs text-slate-400">{{ item.city }}</p>
                        </div>
                    </div>
                    <!-- Stars -->
                    <div class="flex text-[#FFAA2B] mb-3">
                        ★★★★★
                    </div>
                    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                        {{ item.comment | translate }}
                    </p>
                </div>
            </div>
            }

        </div>

    </div>
</section>
